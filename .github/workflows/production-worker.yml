# One-shot batch drain of the email-processing queue.
#
# This is a TEMPORARY runtime, not the worker's home. Render has no free tier for
# Background Workers, so until a permanent host exists this workflow drains the
# backlog on demand. The worker code is identical either way — the same compiled
# entrypoint runs here and on a future Render Background Worker, and only
# WORKER_EXIT_WHEN_DRAINED differs (see backend/src/workers/email.worker.ts).
#
# It is manual on purpose. There is no schedule, no push trigger and no
# pull_request trigger: this job connects to production Redis and the production
# database, so it runs when a human decides it runs and never as a side effect of
# a commit. The production-worker environment adds a required reviewer on top of
# that, so the job pauses for approval before a single step executes.
name: Production Email Worker

on:
  workflow_dispatch:

# Two concurrent drains would not corrupt anything — BullMQ locks each job, and
# PR-9G made the extraction write idempotent under replay — but they would spend
# the runner budget twice to do one queue's work. Queue the second run instead of
# cancelling the first: a cancellation mid-drain interrupts a job that is already
# holding its lock, and waiting is free.
concurrency:
  group: production-email-worker
  cancel-in-progress: false

# The job reads code and runs a process. It opens no pull request, pushes no
# commit and publishes no package, so the default GITHUB_TOKEN is narrowed to
# read-only.
permissions:
  contents: read

jobs:
  drain:
    name: Drain email-processing
    runs-on: ubuntu-latest

    # Gates the job behind the environment's required reviewer and scopes the
    # production secrets to this job alone. Repository-level secrets would be
    # readable by every workflow in the repo, including any future CI that builds
    # a pull request.
    environment: production-worker

    # Generous. At concurrency 1 the current backlog of 101 jobs is minutes of
    # work, and even a pathological run where every job exhausts its three
    # attempts through exponential backoff stays well inside this. The worker
    # exits on its own when the queue is drained; this only bounds the cases
    # where it cannot — a wedged Redis, or a paused queue.
    timeout-minutes: 30

    # The repository is not a workspace root: backend/ is a self-contained npm
    # project with its own package-lock.json, and every command here belongs to
    # it. `uses:` steps are unaffected — checkout still lands in the workspace
    # root.
    defaults:
      run:
        working-directory: backend

    steps:
      # Pinned to a commit SHA rather than a tag. A tag is repointable by whoever
      # controls it, and this job holds production database and Redis
      # credentials — exactly the situation tag-pinning has burned people in.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing in the repository pins a Node version — no engines field, no
      # .nvmrc — so it is stated here. Without it the runner image's preinstalled
      # Node silently changes whenever GitHub rolls the image.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          # Relative to the workspace root, not to working-directory above.
          cache-dependency-path: backend/package-lock.json

      # `npm ci` and not `npm install`: it installs the lockfile exactly and
      # fails if package.json and the lock disagree. It also re-resolves the
      # optional platform binaries for linux-x64 — the committed tree is
      # developed on Windows.
      - name: Install dependencies
        run: npm ci

      # The repository's own build command: prisma generate && tsc && node
      # scripts/fix-esm-imports.js. All three stages are required. `tsc` emits
      # the entrypoint; `prisma generate` is mandatory because generated/prisma
      # is gitignored and therefore absent from a fresh checkout; and
      # fix-esm-imports patches Prisma's extensionless imports, which Node ESM
      # rejects.
      - name: Build the backend
        run: npm run build
        env:
          # NOT a secret, and deliberately a dead value.
          #
          # prisma.config.ts calls env("DIRECT_DATABASE_URL"), and that helper is
          # eager: it throws at config-evaluation time, and the Prisma CLI loads
          # the config for every command including generate. So the build cannot
          # start without *something* here. Nothing reads the value — generate is
          # offline codegen with no engine binary and no connection — so the real
          # unpooled endpoint stays out of GitHub entirely. Migrations are applied
          # deliberately from a workstation (docs/deployment.md §4.5), never here.
          DIRECT_DATABASE_URL: postgresql://unused:unused@localhost:5432/unused

      # Fails fast and legibly when the environment has no secrets yet. Checks
      # presence only: `test -n` reads the variables without printing them, and
      # the messages are literals. Without this the failure surfaces as a pg or
      # ioredis stack trace several seconds later.
      #
      # OPENAI_API_KEY is checked alongside the other two because this drain now
      # runs with USE_AI=true. Without the key `getOpenAIClient()` throws on the
      # first email, `extract()` catches it, and every job silently falls back to
      # regex — a green run whose extraction quality is quietly the old one. A
      # missing credential must fail the run before the first job, not once per
      # job and invisibly.
      - name: Verify credentials are present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL is not set in the production-worker environment"; exit 1; }
          test -n "$REDIS_URL" || { echo "REDIS_URL is not set in the production-worker environment"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not set in the production-worker environment"; exit 1; }

      # The compiled entrypoint, run directly.
      #
      # NOT `npm run worker:email` — that script is `tsx watch`, a development
      # file-watcher that never exits, which would defeat batch mode and hold the
      # runner until the timeout.
      #
      # WORKER_EXIT_WHEN_DRAINED makes the worker own its own lifecycle: it
      # processes the backlog, confirms the queue is genuinely empty (waiting,
      # active, delayed, paused, prioritized and waiting-children all zero), then
      # runs the graceful shutdown path and exits 0. Nothing here needs a sleep
      # loop, a restart loop or a queue-inspection script.
      #
      # USE_AI turns on the AI-assisted branch of email extraction, which has
      # existed in `extraction.service` all along and was gated off here. It is
      # the ONLY thing that flag does in this process: `extract()` still runs the
      # deterministic patterns on every email and still merges AI over regex
      # field by field, and any provider failure is already caught there and
      # degrades the email back to regex-only. So this changes extraction
      # QUALITY, not the drain's control flow — no job fails because OpenAI did.
      #
      # OPENAI_API_KEY is therefore now required, not optional. `getOpenAIClient`
      # reads it lazily on the first gated call and throws when it is absent; the
      # fail-fast step above exists so that absence stops the run rather than
      # turning it into a silently regex-only one.
      #
      # This does NOT enable Document Intelligence. `USE_AI` is read at two
      # independent call sites, and the other one lives in the sibling workflow
      # for the other queue, which deliberately still ships neither variable.
      - name: Drain the queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WORKER_EXIT_WHEN_DRAINED: 'true'
          USE_AI: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node dist/src/workers/email.worker.js
