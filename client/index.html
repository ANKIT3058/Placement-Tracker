<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placement Tracker</title>
    <meta
      name="description"
      content="Track placement registrations, online assessments, pre-placement talks and interviews extracted from your college emails."
    />
    <!-- Matches --bg in src/index.css for each scheme, so the browser
         chrome does not sit in the opposite theme to the page. Two tags
         rather than one: a single theme-color would be wrong in one of
         the two schemes the stylesheet already supports. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171d" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
